<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 700 430" role="img" aria-labelledby="title desc">
  <title id="title">T-Display-S3 iKuai monitor pages 7 through 10</title>
  <desc id="desc">Router health, WAN details, top clients download and upload, and wireless AC status on four 320 by 170 screens.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
    .screen { fill: #000; stroke: #2a2f35; }
    .text { fill: #f5f7fa; }
    .dim { fill: #8a93a3; }
    .idle { fill: #4a5260; }
    .cyan { fill: #37c4d6; }
    .blue { fill: #3fa9f5; }
    .yellow { fill: #ffc800; }
    .orange { fill: #ff7a1a; }
    .green { fill: #36d27e; }
    .red { fill: #ff4057; }
    .rule { stroke: #25313e; stroke-width: 1; }
    .label { font-size: 10px; font-weight: 650; letter-spacing: .15px; }
    .meta { font-size: 10px; }
    .metric { font-size: 34px; font-weight: 650; }
    .caption { fill: #8a93a3; font-size: 13px; }
  </style>
  <rect width="700" height="430" fill="#111"/>

  <!-- PAGE 7: ROUTER HEALTH -->
  <g transform="translate(15 30)">
    <rect class="screen" width="320" height="170" rx="3"/>
    <text class="dim label" x="12" y="15">ROUTER HEALTH</text>
    <text class="green label" x="308" y="15" text-anchor="end">ONLINE</text>
    <line class="rule" x1="12" y1="22" x2="308" y2="22"/>
    <rect x="12" y="31" width="34" height="14" rx="7" fill="#ff7a1a"/>
    <text x="29" y="41.5" text-anchor="middle" font-size="9" fill="#000">CPU</text>
    <rect x="172" y="31" width="34" height="14" rx="7" fill="#3fa9f5"/>
    <text x="189" y="41.5" text-anchor="middle" font-size="9" fill="#000">MEM</text>
    <text class="text metric" x="12" y="78">23</text>
    <text class="orange label" x="63" y="76">%</text>
    <text class="text metric" x="172" y="78">48</text>
    <text class="blue label" x="223" y="76">%</text>
    <line class="rule" x1="12" y1="91" x2="308" y2="91"/>
    <rect x="12" y="100" width="43" height="14" rx="7" fill="#ffc800"/>
    <text x="33.5" y="110.5" text-anchor="middle" font-size="9" fill="#000">TEMP</text>
    <text class="text label" x="92" y="111">46 C</text>
    <rect x="172" y="100" width="54" height="14" rx="7" fill="#ff7a1a"/>
    <text x="199" y="110.5" text-anchor="middle" font-size="9" fill="#000">UPTIME</text>
    <text class="text label" x="244" y="111">3d 07h</text>
    <text class="dim meta" x="12" y="140">RX 84.2GB | TX 9.7GB | V3.7.23</text>
  </g>
  <text class="caption" x="175" y="22" text-anchor="middle">PAGE 7 · 路由健康页</text>

  <!-- PAGE 8: WAN DETAILS -->
  <g transform="translate(365 30)">
    <rect class="screen" width="320" height="170" rx="3"/>
    <rect x="12" y="12" width="42" height="14" rx="7" fill="#3fa9f5"/>
    <text x="33" y="22.5" text-anchor="middle" font-size="9" fill="#000">WAN1</text>
    <text class="green label" x="294" y="22" text-anchor="end">ONLINE</text>
    <circle cx="305" cy="18" r="3" fill="#36d27e"/>
    <text class="cyan label" x="12" y="49">D6.0M</text>
    <text class="blue label" x="308" y="49" text-anchor="end">U1.2M</text>
    <text class="dim meta" x="12" y="70">C 3284 | DROP 0.00% | IP 100.64.1.2</text>
    <line class="rule" x1="12" y1="76" x2="308" y2="76"/>
    <rect x="12" y="86" width="42" height="14" rx="7" fill="#3fa9f5"/>
    <text x="33" y="96.5" text-anchor="middle" font-size="9" fill="#000">WAN2</text>
    <text class="idle label" x="294" y="96" text-anchor="end">UNUSED</text>
    <circle cx="305" cy="92" r="3" fill="#4a5260"/>
    <text class="idle label" x="12" y="123">D--</text>
    <text class="idle label" x="308" y="123" text-anchor="end">U--</text>
    <text class="dim meta" x="12" y="144">C -- | DROP -- | IP --</text>
  </g>
  <text class="caption" x="525" y="22" text-anchor="middle">PAGE 8 · WAN 线路详情页</text>

  <!-- PAGE 9: TOP CLIENTS -->
  <g transform="translate(15 245)">
    <rect class="screen" width="320" height="170" rx="3"/>
    <text class="dim label" x="12" y="15">TOP CLIENTS  D / U</text>
    <text class="dim label" x="308" y="15" text-anchor="end">18 CLIENTS</text>
    <g transform="translate(0 28)">
      <rect x="12" y="0" width="32" height="14" rx="7" fill="#ffc800"/>
      <text x="28" y="10.5" text-anchor="middle" font-size="9" fill="#000">#1</text>
      <text class="text label" x="58" y="11">Xiaomi-TV</text>
      <text class="cyan label" x="170" y="11">D6.0M</text>
      <text class="blue label" x="308" y="11" text-anchor="end">U320K</text>
      <line class="rule" x1="12" y1="30" x2="308" y2="30"/>
    </g>
    <g transform="translate(0 66)">
      <rect x="12" y="0" width="32" height="14" rx="7" fill="#3a4150"/>
      <text x="28" y="10.5" text-anchor="middle" font-size="9" fill="#f5f7fa">#2</text>
      <text class="text label" x="58" y="11">MacBook-Pro</text>
      <text class="cyan label" x="170" y="11">D2.3M</text>
      <text class="blue label" x="308" y="11" text-anchor="end">U860K</text>
      <line class="rule" x1="12" y1="30" x2="308" y2="30"/>
    </g>
    <g transform="translate(0 104)">
      <rect x="12" y="0" width="32" height="14" rx="7" fill="#3a4150"/>
      <text x="28" y="10.5" text-anchor="middle" font-size="9" fill="#f5f7fa">#3</text>
      <text class="text label" x="58" y="11">192.168.9.33</text>
      <text class="cyan label" x="170" y="11">D380K</text>
      <text class="blue label" x="308" y="11" text-anchor="end">U96K</text>
    </g>
    <line class="rule" x1="12" y1="143" x2="308" y2="143"/>
    <text class="dim meta" x="12" y="159">TOTAL DOWN 9.36M | UP 1.02M</text>
  </g>
  <text class="caption" x="175" y="237" text-anchor="middle">PAGE 9 · 终端流量排行页</text>

  <!-- PAGE 10: WIRELESS AC -->
  <g transform="translate(365 245)">
    <rect class="screen" width="320" height="170" rx="3"/>
    <rect x="12" y="12" width="88" height="14" rx="7" fill="#3fa9f5"/>
    <text x="56" y="22.5" text-anchor="middle" font-size="9" fill="#000">WIRELESS AC</text>
    <text class="red label" x="308" y="24" text-anchor="end">OFF</text>
    <line class="rule" x1="12" y1="30" x2="308" y2="30"/>
    <rect x="12" y="42" width="70" height="14" rx="7" fill="#37c4d6"/>
    <text x="47" y="52.5" text-anchor="middle" font-size="9" fill="#000">AP ONLINE</text>
    <text class="red label" x="308" y="54" text-anchor="end">0 / 0</text>
    <rect x="12" y="72" width="38" height="14" rx="7" fill="#ffc800"/>
    <text x="31" y="82.5" text-anchor="middle" font-size="9" fill="#000">2.4G</text>
    <rect x="188" y="72" width="31" height="14" rx="7" fill="#3fa9f5"/>
    <text x="203.5" y="82.5" text-anchor="middle" font-size="9" fill="#000">5G</text>
    <text class="text metric" x="12" y="124">00</text>
    <text class="text metric" x="188" y="124">00</text>
    <line class="rule" x1="12" y1="140" x2="308" y2="140"/>
    <text class="dim meta" x="12" y="159">ACTIVE 0 | IDLE 0 | PEAK 0</text>
  </g>
  <text class="caption" x="525" y="237" text-anchor="middle">PAGE 10 · 无线 AC 状态页</text>
</svg>
