<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1280" viewBox="0 0 800 1280" role="img" aria-labelledby="title desc">
  <title id="title">T-Display-S3 iKuai monitor UI v2</title>
  <desc id="desc">A refined ten-page CUKTECH-inspired network monitor interface for a 320 by 170 screen.</desc>
  <style>
    .sheet{fill:#101318}.screen{fill:#000;stroke:#303844;stroke-width:1}
    .t{font-family:'D-DIN','Bahnschrift','Rajdhani',Arial,sans-serif;fill:#f5f7fa}
    .d{font-family:'D-DIN','Bahnschrift','Rajdhani',Arial,sans-serif;fill:#8a93a3}
    .i{font-family:'D-DIN','Bahnschrift','Rajdhani',Arial,sans-serif;fill:#4a5260}
    .c{fill:#37c4d6}.b{fill:#3fa9f5}.o{fill:#ff7a1a}.g{fill:#36d27e}.r{fill:#ff4057}.y{fill:#ffc800}
    .line{stroke:#1c222b;stroke-width:1}.guide{stroke:#25313e;stroke-width:1;opacity:.55}
    .cd{fill:none;stroke:#37c4d6;stroke-width:2}.bu{fill:none;stroke:#3fa9f5;stroke-width:1.5}.op{fill:none;stroke:#ff7a1a;stroke-width:1.5}
    .cap{font:600 13px Arial,sans-serif;fill:#9da8b8;letter-spacing:.3px}
    .tag{font:600 10px Arial,sans-serif;letter-spacing:.6px}
    .dots{fill:#3a4150}.dot-on{fill:#ffc800}
  </style>
  <rect class="sheet" width="800" height="1280"/>
  <text class="t" x="20" y="24" font-size="16" letter-spacing="1.2">T-DISPLAY-S3 · IKUAI MONITOR · UI V2</text>
  <text class="d" x="780" y="24" text-anchor="end" font-size="11">320 × 170 · NETWORK PROFILE · CUKTECH GRAMMAR</text>

